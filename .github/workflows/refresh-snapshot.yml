# Rebuilds the deployments every day, so the weather, alerts, production forecasts and action plans stay current.
# Setup (once), for whichever deployments you use:
#   Vercel → Project → Settings → Git → Deploy Hooks → hook for "main" → GitHub secret VERCEL_DEPLOY_HOOK_URL
#   Render → Service → Settings → Deploy Hook → copy URL                → GitHub secret RENDER_DEPLOY_HOOK_URL
name: Refresh deployments

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST daily
  workflow_dispatch: {}

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK_URL secret not set — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK"
