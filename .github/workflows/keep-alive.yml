# Backup keep-alive for the Render deployment. The server already pings its own public URL every 10 min;
# this also wakes it if Render ever put it to sleep (free instances sleep after 15 min without traffic).
# Setup (once): GitHub → Settings → Secrets and variables → Actions → Variables → RENDER_URL = https://<service>.onrender.com
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$URL" ]; then echo "RENDER_URL variable not set — skipping"; exit 0; fi
          # a sleeping instance takes ~1 min to wake: retry for up to 3 min
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "${URL%/}/api/health"; then echo; exit 0; fi
            sleep 20
          done
          echo "::warning::Render service did not answer"
